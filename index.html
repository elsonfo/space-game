<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Space Invaders — Missão Cósmica</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02030d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}#wrap{height:100%;display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 20%,#17245a 0,#06091e 36%,#01020a 75%)}#hud{width:min(100%,900px);height:58px;display:flex;align-items:center;justify-content:space-around;padding:6px 10px;background:linear-gradient(180deg,rgba(11,18,48,.96),rgba(3,6,19,.8));border-bottom:1px solid #2d5cff;font-weight:800;letter-spacing:.4px;font-size:14px;text-shadow:0 0 8px #3f78ff}#gamebox{position:relative;width:min(100vw,900px);flex:1;min-height:0}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(1,3,15,.72);backdrop-filter:blur(3px);z-index:5}.card{width:min(92%,560px);padding:25px;border:1px solid #4c6fff;border-radius:22px;text-align:center;background:linear-gradient(145deg,rgba(12,21,59,.96),rgba(4,7,25,.97));box-shadow:0 0 45px rgba(61,100,255,.25)}h1{margin:0 0 7px;font-size:clamp(28px,7vw,48px);background:linear-gradient(90deg,#fff,#77d8ff,#a68cff);-webkit-background-clip:text;color:transparent}h2{margin:4px 0 12px}.card p{line-height:1.45;color:#cbd5ff}.btn{border:0;border-radius:14px;padding:14px 24px;font-weight:900;font-size:16px;color:#071021;background:linear-gradient(90deg,#63e9ff,#7c8dff);box-shadow:0 5px 24px rgba(75,170,255,.35);cursor:pointer}.hidden{display:none!important}#controls{width:min(100%,900px);height:92px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px 12px;gap:12px;background:rgba(2,4,16,.96);border-top:1px solid #182a68}.move{display:flex;gap:10px}.ctrl{width:70px;height:64px;border-radius:18px;border:1px solid #3954a5;background:linear-gradient(#16295f,#09112f);color:#fff;font-size:27px;font-weight:900;box-shadow:inset 0 0 15px rgba(75,126,255,.15);user-select:none}.ctrl:active{transform:scale(.96);background:#233d88}.fire{width:96px;border-color:#e85555;background:linear-gradient(#8b2635,#3b0d1a);font-size:18px;color:#fff}.fire span{display:block;font-size:24px}.stage-tag{color:#7ce8ff}@media (min-width:850px) and (min-height:700px){#controls{height:78px}.ctrl{height:56px}}@media (pointer:fine){#controls{opacity:.88}}
</style>
</head>
<body><div id="wrap"><div id="hud"><span>❤️ <b id="lives">3</b></span><span>⭐ <b id="score">0</b></span><span class="stage-tag">ESTÁGIO <b id="stage">1</b>/5</span><span>🚀 <b id="progress">0%</b></span></div><div id="gamebox"><canvas id="game"></canvas><div class="overlay" id="start"><div class="card"><h1>MISSÃO CÓSMICA</h1><h2>Space Invaders</h2><p>Defenda a galáxia em <b>5 estágios</b>. No computador use ← → ou A/D e Espaço. No celular use os controles inferiores.</p><button class="btn" id="startBtn">INICIAR MISSÃO</button></div></div><div class="overlay hidden" id="message"><div class="card"><h1 id="msgTitle"></h1><p id="msgText"></p><button class="btn" id="msgBtn">CONTINUAR</button></div></div></div><div id="controls"><div class="move"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button class="ctrl fire" id="fire"><span>⚡</span>DISPARAR</button></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),box=document.getElementById('gamebox');let W,H,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=box.clientWidth;H=box.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const S={running:false,stage:1,score:0,lives:3,keys:{},shots:[],enemyShots:[],enemies:[],rocks:[],particles:[],stars:[],boss:null,last:0,stageStart:0};for(let i=0;i<130;i++)S.stars.push({x:Math.random(),y:Math.random(),z:.3+Math.random()*.9});let ship={x:0,y:0,w:42,h:42,speed:330,cool:0,inv:0};
const cfg=[{name:'Primeira Invasão',rows:3,cols:7,speed:24,hp:1},{name:'Campo de Asteroides',rows:3,cols:8,speed:34,hp:1,rocks:true},{name:'Nebulosa Hostil',rows:4,cols:8,speed:48,hp:1,zig:true},{name:'Frota Imperial',rows:4,cols:9,speed:54,hp:2},{name:'Batalha Final',boss:true}];
function resetStage(){S.shots=[];S.enemyShots=[];S.enemies=[];S.rocks=[];S.boss=null;ship.x=W/2;ship.y=H-62;S.stageStart=performance.now();let q=cfg[S.stage-1];if(q.boss)S.boss={x:W/2,y:90,w:150,h:65,hp:80,max:80,dir:1,t:0};else{let gap=Math.min(55,(W-40)/q.cols),total=(q.cols-1)*gap;for(let r=0;r<q.rows;r++)for(let col=0;col<q.cols;col++)S.enemies.push({x:W/2-total/2+col*gap,y:60+r*42,w:28,h:23,hp:q.hp,phase:Math.random()*6.28});}updateHUD()}
function startGame(){S.stage=1;S.score=0;S.lives=3;S.running=true;start.classList.add('hidden');resetStage()}startBtn.onclick=startGame;
function bind(id,key){let e=document.getElementById(id);e.addEventListener('pointerdown',a=>{a.preventDefault();S.keys[key]=true;e.setPointerCapture?.(a.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,()=>S.keys[key]=false))}bind('left','left');bind('right','right');bind('fire','fire');addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))S.keys.left=true;if(['ArrowRight','d','D'].includes(e.key))S.keys.right=true;if(e.code==='Space'){e.preventDefault();S.keys.fire=true}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))S.keys.left=false;if(['ArrowRight','d','D'].includes(e.key))S.keys.right=false;if(e.code==='Space')S.keys.fire=false});
function updateHUD(){lives.textContent=S.lives;score.textContent=S.score;stage.textContent=S.stage;let q=cfg[S.stage-1],p=q.boss?Math.round((1-S.boss?.hp/(S.boss?.max||1))*100):Math.round((1-S.enemies.length/(q.rows*q.cols))*100);progress.textContent=Math.max(0,p)+'%'}function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2}function boom(px,py,n=12){for(let i=0;i<n;i++)S.particles.push({x:px,y:py,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,t:.7+Math.random()*.5})}function shoot(){if(ship.cool<=0){S.shots.push({x:ship.x,y:ship.y-27,w:4,h:17,v:-520});ship.cool=.22}}function enemyFire(e,speed=210){S.enemyShots.push({x:e.x,y:e.y+18,w:5,h:14,v:speed})}function damage(){if(ship.inv>0)return;S.lives--;ship.inv=1.5;boom(ship.x,ship.y,24);if(S.lives<=0)end(false);updateHUD()}function next(){S.running=false;if(S.stage>=5)return end(true);show('ESTÁGIO CONCLUÍDO',cfg[S.stage-1].name+' superado. Prepare-se para: '+cfg[S.stage].name,()=>{S.stage++;resetStage();S.running=true})}function end(win){S.running=false;show(win?'GALÁXIA SALVA!':'MISSÃO ENCERRADA',win?'Você venceu os 5 estágios! Pontuação final: '+S.score:'Pontuação: '+S.score+'. A frota precisa de você novamente.',()=>{message.classList.add('hidden');startGame()},win?'JOGAR NOVAMENTE':'TENTAR NOVAMENTE')}function show(t,txt,cb,label='PRÓXIMO ESTÁGIO'){msgTitle.textContent=t;msgText.textContent=txt;msgBtn.textContent=label;message.classList.remove('hidden');msgBtn.onclick=()=>{message.classList.add('hidden');cb()}}
function update(dt,time){if(!S.running)return;ship.cool-=dt;ship.inv-=dt;if(S.keys.left)ship.x-=ship.speed*dt;if(S.keys.right)ship.x+=ship.speed*dt;ship.x=Math.max(26,Math.min(W-26,ship.x));ship.y=H-60;if(S.keys.fire)shoot();S.shots.forEach(b=>b.y+=b.v*dt);S.enemyShots.forEach(b=>b.y+=b.v*dt);S.shots=S.shots.filter(b=>b.y>-30);S.enemyShots=S.enemyShots.filter(b=>b.y<H+30);let q=cfg[S.stage-1];if(q.boss){let b=S.boss;b.x+=b.dir*85*dt;if(b.x<90||b.x>W-90)b.dir*=-1;b.t-=dt;if(b.t<=0){enemyFire(b,250);enemyFire({x:b.x-45,y:b.y},230);enemyFire({x:b.x+45,y:b.y},230);b.t=.65}for(let sh of S.shots)if(!sh.dead&&hit(sh,b)){sh.dead=true;b.hp--;S.score+=20;boom(sh.x,sh.y,3);if(b.hp<=0){boom(b.x,b.y,70);S.score+=2000;next();break}}}else{for(let e of S.enemies){if(q.zig)e.x+=Math.sin(time/450+e.phase)*24*dt;e.y+=Math.max(0,(q.speed-20)*.05*dt);if(Math.random()<dt*(.04*S.stage))enemyFire(e,190+S.stage*18);for(let sh of S.shots)if(!sh.dead&&!e.dead&&hit(sh,e)){sh.dead=true;e.hp--;boom(e.x,e.y,7);if(e.hp<=0){e.dead=true;S.score+=100*S.stage}}if(e.y>H-95)damage()}S.enemies=S.enemies.filter(e=>!e.dead);if(!S.enemies.length)next();if(q.rocks&&Math.random()<dt*.7)S.rocks.push({x:20+Math.random()*(W-40),y:-30,w:25+Math.random()*25,h:25,v:100+Math.random()*90,rot:Math.random()*6})}if(q.rocks){for(let r of S.rocks){r.y+=r.v*dt;r.rot+=dt;if(hit(r,ship)){r.y=H+99;damage()}}S.rocks=S.rocks.filter(r=>r.y<H+50)}for(let b of S.enemyShots)if(!b.dead&&hit(b,ship)){b.dead=true;damage()}S.shots=S.shots.filter(b=>!b.dead);S.enemyShots=S.enemyShots.filter(b=>!b.dead);for(let p of S.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}S.particles=S.particles.filter(p=>p.t>0);updateHUD()}
function drawShip(){x.save();x.translate(ship.x,ship.y);if(ship.inv>0&&Math.floor(ship.inv*10)%2)x.globalAlpha=.25;x.shadowBlur=18;x.shadowColor='#45dfff';x.fillStyle='#dffaff';x.beginPath();x.moveTo(0,-28);x.lineTo(13,-5);x.lineTo(28,10);x.lineTo(13,12);x.lineTo(7,22);x.lineTo(-7,22);x.lineTo(-13,12);x.lineTo(-28,10);x.lineTo(-13,-5);x.closePath();x.fill();x.fillStyle='#3f73ff';x.beginPath();x.ellipse(0,-5,7,12,0,0,Math.PI*2);x.fill();x.fillStyle='#ff8b38';x.beginPath();x.moveTo(-7,22);x.lineTo(0,36+Math.random()*8);x.lineTo(7,22);x.fill();x.restore()}
function draw(){x.clearRect(0,0,W,H);let g=x.createRadialGradient(W*.5,H*.25,10,W*.5,H*.4,Math.max(W,H));g.addColorStop(0,S.stage===3?'#311557':'#101d4c');g.addColorStop(1,'#01020a');x.fillStyle=g;x.fillRect(0,0,W,H);for(let s of S.stars){s.y+=.00015*s.z;if(s.y>1)s.y=0;x.globalAlpha=.35+s.z*.6;x.fillStyle='#fff';x.fillRect(s.x*W,s.y*H,1+s.z*1.4,1+s.z*1.4)}x.globalAlpha=1;if(!S.running&&!start.classList.contains('hidden'))return;let q=cfg[S.stage-1];if(q.boss&&S.boss){let b=S.boss;x.save();x.translate(b.x,b.y);x.shadowBlur=25;x.shadowColor='#e653ff';x.fillStyle='#582073';x.beginPath();x.ellipse(0,0,75,28,0,0,Math.PI*2);x.fill();x.fillStyle='#b85cff';x.beginPath();x.ellipse(0,-15,35,25,0,Math.PI,Math.PI*2);x.fill();x.fillStyle='#ff4b69';for(let i=-2;i<=2;i++)x.fillRect(i*22-4,10,8,8);x.restore();x.fillStyle='#351020';x.fillRect(W/2-100,22,200,10);x.fillStyle='#ff4770';x.fillRect(W/2-100,22,200*(b.hp/b.max),10)}for(let e of S.enemies){x.save();x.translate(e.x,e.y);x.shadowBlur=10;x.shadowColor=S.stage>=4?'#ff667a':'#63e9ff';x.fillStyle=S.stage>=4?'#ff647a':'#72eaff';x.fillRect(-12,-8,24,16);x.fillRect(-17,-3,34,8);x.fillStyle='#071029';x.fillRect(-7,-3,4,4);x.fillRect(3,-3,4,4);x.restore()}for(let r of S.rocks){x.save();x.translate(r.x,r.y);x.rotate(r.rot);x.fillStyle='#817b82';x.beginPath();x.moveTo(-r.w/2,0);x.lineTo(-r.w/4,-r.w/2);x.lineTo(r.w/3,-r.w/2.4);x.lineTo(r.w/2,r.w/5);x.lineTo(0,r.w/2);x.closePath();x.fill();x.restore()}x.fillStyle='#79eaff';for(let b of S.shots){x.shadowBlur=10;x.shadowColor='#6efaff';x.fillRect(b.x-2,b.y-9,4,18)}x.fillStyle='#ff536d';for(let b of S.enemyShots)x.fillRect(b.x-2,b.y-7,5,14);x.shadowBlur=0;for(let p of S.particles){x.globalAlpha=Math.min(1,p.t);x.fillStyle='#ffd66e';x.fillRect(p.x,p.y,3,3)}x.globalAlpha=1;drawShip()}function loop(t){let dt=Math.min(.033,(t-S.last)/1000||0);S.last=t;update(dt,t);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
